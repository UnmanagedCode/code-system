<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#14171c" />
  <title>Code System</title>
  <!-- RELATIVE, every one of them. The plugin is served under an
       X-Forwarded-Prefix it does not know, so a leading slash would break the
       page the moment it is mounted under code-conductor. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="title-block">
      <h1>Code System</h1>
      <p class="subtitle">Docker containers and SSH hosts, reached from code-conductor's own machine.</p>
    </div>
    <div class="pills">
      <span id="reg-pill" class="pill" title="System registration with code-conductor"></span>
    </div>
  </header>

  <main id="app">
    <div id="registration"></div>
    <div class="toolbar">
      <button id="add">+ Add remote</button>
      <span id="updated"></span>
      <button id="refresh" title="Refresh">↻</button>
    </div>
    <div id="empty" class="empty">Loading remotes…</div>
    <div id="remotes"></div>
  </main>

  <script type="module" src="app.js"></script>
  <!-- ABSOLUTE, and the only absolute URL on the page: the bridge is served by
       the conductor, not by this plugin. Required verbatim by the plugin
       compliance checklist. -->
  <script src="/pluginBridge.js" defer></script>
</body>
</html>
